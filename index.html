<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Speedy Network · Speedy Mobile Auto Repair</title>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&family=Teko:wght@600;700&display=swap" rel="stylesheet" />
  <style>
    :root { --ink:#f5f0e6; --muted:#a89f8f; --gold:#d4af37; --goldb:#f0c94a; --line:rgba(212,175,55,.28); }
    * { box-sizing:border-box; }
    html, body { margin:0; min-height:100%; background:#000; color:var(--ink); font-family:Sora,system-ui,sans-serif; }
    a { color:inherit; text-decoration:none; }
    .wrap { max-width:480px; margin:0 auto; min-height:100dvh; padding:0 18px 110px; }
    .brand-bar { display:flex; justify-content:center; padding:14px 0 8px; }
    .lockup { width:min(100%,420px); height:auto; display:block; }
    .note { color:var(--muted); font-size:13px; line-height:1.45; margin:10px 0; }
    .kicker { letter-spacing:.14em; font-size:11px; text-transform:uppercase; color:var(--gold); }
    .center { text-align:center; }
    .btn { display:flex; flex-direction:column; align-items:center; justify-content:center; width:100%; border:none; border-radius:14px; padding:16px 14px; margin:10px 0; font-weight:700; letter-spacing:.03em; text-align:center; }
    .btn small { font-weight:500; opacity:.8; margin-top:3px; font-size:12px; }
    .btn-gold { background:linear-gradient(135deg,#f0c94a 0%,#d4af37 45%,#b8922a 100%); color:#111; }
    .btn-ghost { background:transparent; border:1px solid var(--line); color:var(--goldb); }
    .row { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
    .bottom { position:fixed; left:0; right:0; bottom:0; z-index:20; border-top:1px solid var(--line); background:rgba(0,0,0,.94); display:grid; grid-template-columns:repeat(4,1fr); padding:10px 8px calc(10px + env(safe-area-inset-bottom)); max-width:480px; margin:0 auto; }
    .bottom a { text-align:center; font-size:12px; color:var(--muted); padding:6px 0; }
    .bottom a.on { color:var(--goldb); }
    .splash { position:fixed; inset:0; z-index:80; background:#000; display:grid; place-items:center; transition:opacity .7s ease; }
    .splash.gone { opacity:0; pointer-events:none; }
    .sting { width:min(92vw,420px); animation:sting 4.6s ease forwards; }
    @keyframes sting { 0% { opacity:0; transform:scale(.86); filter:blur(8px);} 18% { opacity:1; transform:scale(.96); filter:blur(0);} 100% { opacity:1; transform:scale(1.06);} }
    .skip { position:absolute; bottom:calc(28px + env(safe-area-inset-bottom)); left:50%; transform:translateX(-50%); background:transparent; border:1px solid var(--line); color:var(--goldb); border-radius:999px; padding:8px 16px; font-size:12px; letter-spacing:.12em; text-transform:uppercase; cursor:pointer; }
  </style>
</head>
<body>
  <div class="splash" id="splash">
    <svg class="sting" viewBox="0 0 980 280" role="img" aria-label="SPEEDY Mobile Auto Repair and Shop Services">
      <defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#F3D36A"/><stop offset="45%" stop-color="#D4AF37"/><stop offset="100%" stop-color="#9A7B1A"/></linearGradient></defs>
      <g transform="translate(18,28)"><circle cx="108" cy="112" r="104" fill="#000" stroke="url(#g)" stroke-width="7"/><path fill="url(#g)" d="M34 118c8-18 28-32 52-36 10-2 18-4 22-12 6-12 18-22 34-22 14 0 24 6 32 14 6 6 14 10 24 10 4 18 6 28 6 36-18 4-84 8-140 6-12 0-24-2-30 4z"/><circle cx="58" cy="196" r="7" fill="#000" stroke="url(#g)" stroke-width="3"/><circle cx="148" cy="196" r="7" fill="#000" stroke="url(#g)" stroke-width="3"/></g>
      <g transform="translate(168,28)"><circle cx="108" cy="112" r="104" fill="#000" stroke="url(#g)" stroke-width="7"/><g transform="translate(48,36)"><path fill="url(#g)" d="M28 8c12 0 22 10 22 22 0 6-2 11-6 15l8 8-10 10-8-8c-4 3-9 5-14 5-12 0-22-10-22-22 0-4 1-8 3-11L12 38l8-8-11-10C13 16 20 8 28 8zm0 10a10 10 0 100 20 10 10 0 000-20z"/><rect x="24" y="48" width="10" height="78" rx="4" fill="url(#g)"/></g></g>
      <text x="430" y="148" fill="url(#g)" font-family="Teko, Arial Black, Impact, sans-serif" font-size="112" font-weight="700" letter-spacing="4">SPEEDY</text>
      <text x="436" y="186" fill="#D4AF37" font-family="Sora, Arial, sans-serif" font-size="15" font-weight="600" letter-spacing="3.4">MOBILE AUTO REPAIR AND SHOP SERVICES</text>
    </svg>
    <button class="skip" type="button" id="skip">Tap to enter</button>
  </div>
  <div class="wrap">
    <header class="brand-bar">
      <svg class="lockup" viewBox="0 0 980 280"><defs><linearGradient id="g2" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#F3D36A"/><stop offset="45%" stop-color="#D4AF37"/><stop offset="100%" stop-color="#9A7B1A"/></linearGradient></defs>
      <g transform="translate(18,28)"><circle cx="108" cy="112" r="104" fill="#000" stroke="url(#g2)" stroke-width="7"/><path fill="url(#g2)" d="M34 118c8-18 28-32 52-36 10-2 18-4 22-12 6-12 18-22 34-22 14 0 24 6 32 14 6 6 14 10 24 10 4 18 6 28 6 36-18 4-84 8-140 6-12 0-24-2-30 4z"/><circle cx="58" cy="196" r="7" fill="#000" stroke="url(#g2)" stroke-width="3"/><circle cx="148" cy="196" r="7" fill="#000" stroke="url(#g2)" stroke-width="3"/></g>
      <g transform="translate(168,28)"><circle cx="108" cy="112" r="104" fill="#000" stroke="url(#g2)" stroke-width="7"/><g transform="translate(48,36)"><path fill="url(#g2)" d="M28 8c12 0 22 10 22 22 0 6-2 11-6 15l8 8-10 10-8-8c-4 3-9 5-14 5-12 0-22-10-22-22 0-4 1-8 3-11L12 38l8-8-11-10C13 16 20 8 28 8zm0 10a10 10 0 100 20 10 10 0 000-20z"/><rect x="24" y="48" width="10" height="78" rx="4" fill="url(#g2)"/></g></g>
      <text x="430" y="148" fill="url(#g2)" font-family="Teko, Arial Black, Impact, sans-serif" font-size="112" font-weight="700" letter-spacing="4">SPEEDY</text>
      <text x="436" y="186" fill="#D4AF37" font-family="Sora, Arial, sans-serif" font-size="15" font-weight="600" letter-spacing="3.4">MOBILE AUTO REPAIR AND SHOP SERVICES</text></svg>
    </header>
    <p class="note center">Two doors. First tap is the intake button. No auto-dispatch.</p>
    <a class="btn btn-gold" href="https://portal.ari.app/b/kCHD15A2N0Vobeo5jdgZhwQBJTA3">I NEED A MECHANIC<small>Open an intake — not a booked job</small></a>
    <a class="btn btn-ghost" href="apply.html">I’M A MECHANIC<small>Apply · pick each skill separately</small></a>
    <p class="note center">Roadside, stranded, unsafe, or after-hours — call 704-835-2577 or Text Ava.</p>
    <a class="btn btn-ghost" href="https://portal.ari.app/b/kCHD15A2N0Vobeo5jdgZhwQBJTA3">Book ARI</a>
    <div class="row"><a class="btn btn-gold" href="tel:+17048352577">Call 704-835-2577</a><a class="btn btn-gold" href="sms:+17048352577">Text Ava</a></div>
  </div>
  <nav class="bottom"><a href="index.html" class="on">Home</a><a href="vendor.html">Vendor</a><a href="rate.html">Rate</a><a href="shop.html">Shop</a></nav>
  <script>
    const splash = document.getElementById("splash");
    const hide = () => splash && splash.classList.add("gone");
    document.getElementById("skip").addEventListener("click", hide);
    splash.addEventListener("click", hide);
    setTimeout(hide, 4800);
  </script>
</body>
</html>
